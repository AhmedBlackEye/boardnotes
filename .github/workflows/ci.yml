name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: boardnotes
          POSTGRES_PASSWORD: boardnotes
          POSTGRES_DB: boardnotes
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U boardnotes" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - name: Load schema
        run: psql postgresql://boardnotes:boardnotes@localhost:5433/boardnotes -f supabase/migrations/0001_init.sql
      - run: make setup
      - run: make contracts
      - run: make check
