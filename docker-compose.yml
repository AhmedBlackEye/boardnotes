# Local Postgres for development and tests. Production/demo uses Supabase cloud (same schema).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boardnotes
      POSTGRES_PASSWORD: boardnotes
      POSTGRES_DB: boardnotes
    ports:
      - "5433:5432"
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardnotes"]
      interval: 2s
      retries: 20
